<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Meses de Muito Amor ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap');
        
        body {
            background-color: #ffe6e6;
            color: #d147a3;
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #e63946;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(230, 57, 70, 0.15);
            max-width: 450px;
            width: 90%;
            margin: 20px;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
            margin: 20px 0;
        }

        .counter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        .time-box {
            background: #ffb3c6;
            color: white;
            padding: 12px 15px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.6rem;
            min-width: 60px;
            box-shadow: 0 4px 10px rgba(255, 179, 198, 0.5);
        }

        .time-label {
            display: block;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .heart {
            color: #e63946;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .photo-frame {
            width: 180px;
            height: 180px;
            background-color: #ffd6e0;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 6px solid #ffb3c6;
            overflow: hidden;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Feliz 7 Meses! <span class="heart">❤️</span></h1>

        <div class="photo-frame">
            <!-- Para a imagem não ficar em branco, coloquei uma de teste. Você pode trocar o link abaixo pelo da foto de vocês! -->
            <img src="https://placehold.co/200x200/ffb3c6/ffffff?text=Sua+Foto+Aqui" alt="Nossa Foto">
        </div>

        <p>Desde o dia <strong>2 de janeiro</strong>, minha vida ficou muito mais colorida. Cada segundo ao seu lado é o meu momento favorito do dia!</p>

        <h3 style="color: #e63946; font-family: 'Pacifico', cursive; font-size: 1.8rem; margin-bottom: 10px;">Tempo Juntinhos:</h3>
        
        <div class="counter">
            <div class="time-box"><span id="days">0</span><span class="time-label">Dias</span></div>
            <div class="time-box"><span id="hours">0</span><span class="time-label">Horas</span></div>
            <div class="time-box"><span id="minutes">0</span><span class="time-label">Min</span></div>
            <div class="time-box"><span id="seconds">0</span><span class="time-label">Seg</span></div>
        </div>

        <p style="font-weight: bold; color: #d147a3;">Te amo hoje, amanhã e sempre! 💕</p>
    </div>

    <script>
        // Configuração da data: Ano de 2026, Mês 0 (Janeiro), Dia 2.
        const startDate = new Date(2026, 0, 2, 0, 0, 0).getTime();

        function updateCounter() {
            const now = new Date().getTime();
            const difference = now - startDate;

            // Cálculos de tempo
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Atualiza o HTML
            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        setInterval(updateCounter, 1000);
        updateCounter(); 
    </script>
</body>
</html>
